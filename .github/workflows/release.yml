name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 注意: install.sh 按 uname -m 映射期望的 ARCH 命名
          - { arch: amd64, target: linux/amd64,          suffix: ''   }
          - { arch: armv7, target: linux/arm/v7,          suffix: ''   }   # 玩客云 S805
          - { arch: arm64, target: linux/arm64,           suffix: ''   }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ github.event.inputs.tag_name }}}
          [ -z "$VERSION" ] && VERSION="dev-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # matrix.arch 已经是 install.sh 约定的名字 (amd64/armv7/arm64)
          ARCH_NAME="${{ matrix.arch }}"
          # 映射到 Go 编译器的 GOARCH + GOARM
          case "$ARCH_NAME" in
            amd64)  GOARCH=amd64; GOARM=   ;;
            armv7)  GOARCH=arm;   GOARM=7 ;;
            arm64)  GOARCH=arm64; GOARM=   ;;
            *)      echo "unknown arch: $ARCH_NAME"; exit 1 ;;
          esac
          echo "GOARCH=$GOARCH GOARM=$GOARM"

          # install.sh 约定的裸二进制名 (不带版本,按 ARCH)
          BIN_BARE="openlist-mount-${ARCH_NAME}"
          # 带版本+平台的完整名
          BIN_VER="openlist-mount_${VERSION}_linux-${ARCH_NAME}"

          GOARCH="$GOARCH" GOARM="$GOARM" go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "$BIN_BARE" .

          cp "$BIN_BARE" "$BIN_VER"

          # tarball (带 install.sh + uninstall.sh)
          tar czf "${BIN_VER}.tar.gz" \
            --transform "s|^${BIN_BARE}|openlist-mount|" \
            "$BIN_BARE" install.sh uninstall.sh

          # 裸二进制 gz
          gzip -kf "$BIN_VER"

          ls -lh openlist-mount-* openlist-mount_* 2>/dev/null
          echo "BIN_BARE=$BIN_BARE" >> "$GITHUB_ENV"
          echo "BIN_VER=$BIN_VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_VER }}
          path: |
            ${{ env.BIN_BARE }}       # ← install.sh 约定的名字
            ${{ env.BIN_VER }}
            ${{ env.BIN_VER }}.tar.gz
            ${{ env.BIN_VER }}.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          # glob 匹配所有产物 (install.sh 约定的裸二进制 + 带版本的包)
          files: |
            dist/openlist-mount-*             # ← install.sh 用
            dist/openlist-mount_*.tar.gz      # ← 用户手动下载
            dist/openlist-mount_*.gz          # ← 用户手动下载
