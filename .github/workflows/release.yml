name: Release

# 触发方式: 推 tag v*.*.* 或手动点 Run workflow
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write   # 创建 Release + 上传 assets 需要

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 服务器
          - { os: linux,  arch: amd64,   arm: ''    }
          # 玩客云 / 树莓派 2/3 (armv7, 玩客云 S805)
          - { os: linux,  arch: arm,     arm: '7'   }
          # 树莓派 4/5 / 现代 NAS
          - { os: linux,  arch: arm64,   arm: ''    }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS:   ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM:  ${{ matrix.arm }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ github.event.inputs.tag_name }}}
          # 没有 tag 时用 "dev-<sha>" 占位
          [ -z "$VERSION" ] && VERSION="dev-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          SUFFIX="${GOOS}-${GOARCH}"
          [ -n "$GOARM" ] && SUFFIX="${SUFFIX}v${GOARM}"
          BIN="openlist-mount_${VERSION}_${SUFFIX}"

          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "$BIN" .

          # 额外打 tarball (附带 install.sh / uninstall.sh)
          cp install.sh install.sh.bak
          sed -i "s|VERSION=\"latest\"|VERSION=\"${VERSION}\"|" install.sh || true
          tar czf "${BIN}.tar.gz" "$BIN" install.sh uninstall.sh systemd.go 2>/dev/null || \
            tar czf "${BIN}.tar.gz" "$BIN" install.sh uninstall.sh
          mv install.sh.bak install.sh

          # 也放一份纯二进制
          gzip -kf "$BIN"

          ls -lh "${BIN}" "${BIN}.tar.gz" "${BIN}.gz"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: |
            ${{ env.BIN }}
            ${{ env.BIN }}.tar.gz
            ${{ env.BIN }}.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          files: |
            dist/openlist-mount_*.tar.gz
            dist/openlist-mount_*.gz
